name: Splunk App CI/CD
on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch: {}
  schedule:
    # Weekly re-run of main, so it never goes stale unseen against new
    # Splunk, AppInspect and dependency releases. Tag-only jobs skip it.
    - cron: "8 5 * * 2"
permissions:
  pull-requests: write
  actions: write
  checks: write
# Cancel a superseded run on the same branch or pull request, so CI never
# spends time on code that has already been replaced. The default branch is
# never cancelled: every push there gets its own complete run, because a
# cancelled run on a branch that deploys or releases can let commits go out
# unchecked (haloclock-app, 13 Oct 2026).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # The Splunk versions CI tests and Splunkbase lists come from one file in
  # livehybrid/deploy-splunk-app-action (splunk-versions.json).
  splunk-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.v.outputs.matrix }}
    steps:
      - id: v
        uses: livehybrid/deploy-splunk-app-action/splunk-versions@v1

  package:
    # ubuntu-24.04 because ubuntu-latest (26.04) has no Python 3.9.
    runs-on: ubuntu-24.04
    steps:
      - name: Package app
        uses: livehybrid/deploy-splunk-app-action@v1
        with:
          python-version: "3.9"

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@v1
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  quality-appinspect-api:
    name: quality-appinspect-api
    needs:
      - appinspect
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-api.yml@v1
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
  
  integration-test:
    name: integration-test (splunk-docker ${{ matrix.splunk }})
    needs: [package, splunk-versions]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The supported floor and the newest Splunk (shared splunk-versions.json).
        splunk: ${{ fromJSON(needs.splunk-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk
        uses: livehybrid/deploy-splunk-app-action/splunk-docker/free-disk@v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install UCC framework + pytest
        run: pip install --upgrade splunk-add-on-ucc-framework pytest

      - name: Build add-on into stage/
        shell: bash
        run: |
          ucc-gen build --source package --ta-version 1.0.8
          rm -r -f stage && mkdir -p stage
          cp -r output/TA-aws-trusted-advisor stage/TA-aws-trusted-advisor
          # A throwaway TLS pair for the mock's https port: real AWS endpoints
          # are https, so tests/test_proxy.py needs the CONNECT path too.
          mkdir -p docker/mock/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=mockaws" \
            -addext "subjectAltName=DNS:mockaws,DNS:mockaws-remote" \
            -keyout docker/mock/tls/key.pem -out docker/mock/tls/cert.pem
          chmod 644 docker/mock/tls/*.pem

      - name: Start Splunk (wait for health)
        uses: livehybrid/deploy-splunk-app-action/splunk-docker/start@v1
        with:
          version: ${{ matrix.splunk }}
          app-dir: stage/TA-aws-trusted-advisor
          app-dir-mode: "777"

      # botocore verifies TLS against certifi's bundle (Splunk's Python here:
      # boto3 is not vendored), so the mock's certificate goes into every
      # bundle in the test container, as a corporate CA would be installed.
      - name: Trust the mock's TLS certificate in the Splunk container
        working-directory: docker
        run: |
          docker cp mock/tls/cert.pem ta_aws_trusted_advisor_splunk:/tmp/mockaws.pem
          docker exec -u root ta_aws_trusted_advisor_splunk sh -c '
            n=0
            for f in $(find /opt/splunk/lib /opt/splunk/etc/apps/TA-aws-trusted-advisor -name cacert.pem); do
              cat /tmp/mockaws.pem >> "$f"; echo "trusts mockaws: $f"; n=$((n+1))
            done
            [ "$n" -gt 0 ]'

      - name: Run integration suite
        env:
          SPLUNK_MGMT_URL: https://127.0.0.1:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
          SPLUNK_CONTAINER: ta_aws_trusted_advisor_splunk
          MOCK_AWS_URL: http://127.0.0.1:8080
          MOCK_AWS_URL_FROM_SPLUNK: http://mockaws:8080
        run: pytest tests/ -v -ra

      # Browser checks of the UCC Configuration and Inputs pages, on the same
      # Splunk (after pytest, so neither suite sees the other's inputs).
      - name: Browser tests (Playwright)
        if: ${{ !cancelled() }}
        uses: livehybrid/deploy-splunk-app-action/playwright@v1
        env:
          SPLUNK_WEB_URL: http://localhost:8000
          SPLUNK_MGMT_URL: https://localhost:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
        with:
          ucc-helpers: ucc/ucc-helpers.js
          artifact-name: e2e-results-${{ matrix.splunk }}

      - name: Inputs ran on the expected Python
        uses: livehybrid/deploy-splunk-app-action/splunk-docker/expected-python@v1
        with:
          container: ta_aws_trusted_advisor_splunk
          app: TA-aws-trusted-advisor

      - name: Diagnostics on failure
        if: failure()
        working-directory: docker
        run: |
          docker exec ta_aws_trusted_advisor_splunk /opt/splunk/bin/splunk search \
            'search index=_internal (source=*ta-aws-trusted-advisor* OR component=ExecProcessor) (trusted OR advisor OR aws) earliest=-15m | head 25 | table _time component _raw' \
            -auth admin:Changeme1! 2>&1 | head -40 || true
          echo "--- mock AWS request log"
          curl -s http://127.0.0.1:8080/_mock/requests | head -c 6000 || true
          echo; docker compose logs --tail 60 mockaws || true
          echo "--- proxy log"; docker logs ta_aws_trusted_advisor_proxy 2>&1 | tail -40 || true

      - name: Splunk logs on failure
        if: failure()
        uses: livehybrid/deploy-splunk-app-action/splunk-docker/logs@v1
        with:
          services: splunk
          container: ta_aws_trusted_advisor_splunk
          tail: "200"

      - name: Tear down
        if: always()
        uses: livehybrid/deploy-splunk-app-action/splunk-docker/teardown@v1

  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - integration-test
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@v1

  publish-splunkbase:
    # Tag runs only: needs the GitHub release (all CLI gates + integration)
    # and Splunk's hosted AppInspect. Uploads stay off until the repo variable
    # SPLUNKBASE_PUBLISH_ENABLED=true. The compatibility list is the shared
    # splunk-versions.json, the same file the integration matrix uses.
    needs:
      - publish-gh
      - quality-appinspect-api
    permissions:
      contents: read
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish-splunkbase.yml@v1
    with:
      app_id: "4207"
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
