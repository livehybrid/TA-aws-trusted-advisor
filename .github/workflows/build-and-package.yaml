name: Splunk App CI/CD
on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch: {}
  schedule:
    # Weekly re-run of main, so it never goes stale unseen against new
    # Splunk, AppInspect and dependency releases. Tag-only jobs skip it.
    - cron: "8 5 * * 2"
permissions:
  pull-requests: write
  actions: write
  checks: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Package app
        uses: livehybrid/deploy-splunk-app-action@main
        with:
          python-version: "3.9"

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@main
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  quality-appinspect-api:
    name: quality-appinspect-api
    needs:
      - appinspect
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-api.yml@main
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
  
  integration-test:
    name: integration-test (splunk-docker ${{ matrix.splunk }})
    needs: package
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest Splunk this release claims on Splunkbase.
        splunk: ["10.0", "10.6.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install UCC framework + pytest
        run: pip install --upgrade splunk-add-on-ucc-framework pytest

      - name: Build add-on into stage/
        shell: bash
        run: |
          ucc-gen build --source package --ta-version 1.0.8
          rm -rf stage && mkdir -p stage
          cp -r output/TA-aws-trusted-advisor stage/TA-aws-trusted-advisor
          chmod -R 777 stage/TA-aws-trusted-advisor

      - name: Start Splunk (wait for health)
        working-directory: docker
        env:
          SPLUNK_IMAGE_TAG: ${{ matrix.splunk }}
        run: docker compose up -d --wait --wait-timeout 360

      - name: Run integration suite
        env:
          SPLUNK_MGMT_URL: https://127.0.0.1:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
          SPLUNK_CONTAINER: ta_aws_trusted_advisor_splunk
        run: pytest tests/ -v -ra

      - name: Diagnostics on failure
        if: failure()
        working-directory: docker
        run: |
          docker exec ta_aws_trusted_advisor_splunk /opt/splunk/bin/splunk search \
            'search index=_internal (source=*ta-aws-trusted-advisor* OR component=ExecProcessor) (trusted OR advisor OR aws) earliest=-15m | head 25 | table _time component _raw' \
            -auth admin:Changeme1! 2>&1 | head -40 || true

      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v || true

  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - integration-test
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@main

  publish-splunkbase:
    # Tag runs only: needs the GitHub release (all CLI gates + integration)
    # and Splunk's hosted AppInspect. Uploads stay off until the repo variable
    # SPLUNKBASE_PUBLISH_ENABLED=true.
    needs:
      - publish-gh
      - quality-appinspect-api
    permissions:
      contents: read
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish-splunkbase.yml@main
    with:
      app_id: "4207"
      splunk_versions: "10.6,10.5,10.4,10.3,10.2,10.1,10.0,9.4"
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
