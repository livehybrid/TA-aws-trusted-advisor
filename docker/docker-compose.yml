services:
  splunk:
    image: splunk/splunk:${SPLUNK_IMAGE_TAG:-10.0}
    container_name: ta_aws_trusted_advisor_splunk
    hostname: splunk
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:-Changeme1!}
      SPLUNK_HEC_TOKEN: ""
    ports:
      # Fixed ports so the suite can hit https://127.0.0.1:8089 directly.
      # On a CI runner nothing else contends for these.
      - "8000:8000"
      - "8089:8089"
    volumes:
      # The built add-on is bind-mounted live from ../stage so a rebuild on the
      # host updates the running container. The stage/ copy is a throwaway test
      # build (widened perms), never the packaged artefact.
      - ../stage/TA-aws-trusted-advisor:/opt/splunk/etc/apps/TA-aws-trusted-advisor
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:8089/services/server/info", "-u", "admin:${SPLUNK_PASSWORD:-Changeme1!}"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s
    depends_on:
      mockaws:
        condition: service_healthy

  # Mock AWS Support (Trusted Advisor) API for the end-to-end data test.
  # Splunk reaches it as http://mockaws:8080 through the add-on's endpoint
  # override; the suite on the host reads its dataset and request log on :8080.
  mockaws:
    image: python:3.12-alpine
    container_name: ta_aws_trusted_advisor_mockaws
    command: ["python", "-u", "/mock/mock_aws.py"]
    volumes:
      - ./mock:/mock:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/_mock/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
