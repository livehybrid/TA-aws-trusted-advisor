# Test-only forward proxy for the integration suite (see docker-compose.yml).
# 3128 is open; 3129 needs basic auth as e2euser (password in tests/, hash in
# e2e-passwd). The access log goes to stdout, one PROXYLOG line per request,
# so the tests read it with `docker logs`: a record the add-on never sees.
http_port 3128 name=open
http_port 3129 name=auth
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/e2e-passwd
auth_param basic realm e2e-proxy
acl authport myportname auth
acl authed proxy_auth REQUIRED
http_access deny authport !authed
http_access allow all
cache deny all
strip_query_terms off
logformat e2e PROXYLOG port=%lp client=%>a status=%Ss/%>Hs method=%rm url=%ru user=%un
# The container's own healthcheck connects from 127.0.0.1; keep it out of the log.
acl healthcheck src 127.0.0.1
access_log stdio:/dev/stdout e2e !healthcheck
cache_log stdio:/dev/stderr
pid_filename none
shutdown_lifetime 1 seconds
