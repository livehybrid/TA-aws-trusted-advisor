# Test-only SOCKS server on 1080 (none), see Dockerfile.
logoutput: stdout
internal: 0.0.0.0 port = 1080
# Two networks (docker-compose.yml): leave by whichever routes to the target.
external: eth0
external: eth1
external.rotation: route
clientmethod: none
socksmethod: none
user.privileged: root
user.unprivileged: nobody

# The container's own healthcheck: never logged.
client pass {
    from: 127.0.0.0/8 to: 0.0.0.0/0
}
client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: error
}
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect
    log: connect error
}
